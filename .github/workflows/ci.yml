name: Node.js CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build --if-present

      - name: GIF_CLIENT CI Discord Notification (success)
        if: ${{ success() }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD }}
          title: '✅ GIF_CLIENT CI Success! ✅'
          status: ${{ job.status }}
          description: 'GIF Client 빌드 성공'
          color: 65280
          url: 'https://github.com/sarisia/actions-status-discord'
          username: 'GIF-CLIENT-bot'

      - name: GIF_CLIENT CI Discord Notification (failure)
        if: ${{ failure() }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD }}
          title: '❗️ GIF_CLIENT CI Fail! ❗️'
          status: ${{ job.status }}
          description: 'GIF Cliant 빌드 실패'
          color: 16711680
          url: 'https://github.com/sarisia/actions-status-discord'
          username: 'GIF-CLIENT-bot'